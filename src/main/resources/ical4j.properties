# Configuracao da ical4j, a biblioteca que le as agendas .ics.
#
# Lida pela propria biblioteca, pelo nome deste arquivo, ao ser carregada.

# Nunca ir a internet buscar fuso horario atualizado: os fusos vem dentro da
# biblioteca e do proprio arquivo do Google. A unica conexao do MyApp com o
# Google e a sincronizacao da agenda, feita por ele mesmo.
net.fortuna.ical4j.timezone.update.enabled=false

# Tolerancia com arquivos fora do padrao a risca. Agendas reais - do Google,
# do Outlook - escorregam em detalhes, e recusar o arquivo inteiro por causa
# de um evento torto deixaria a tela vazia.
ical4j.unfolding.relaxed=true
ical4j.parsing.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
